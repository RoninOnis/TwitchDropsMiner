name: Build

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  USE_UPX: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Validate language files
        run: |
          failed=()
          for file in "lang/"*.json; do
            if err="$(python -m json.tool "${file}" 2>&1 >/dev/null)"; then
              echo "[OK] ${file}"
            else
              echo "[ERROR] ${file} ${err}"
              failed+=("${file}")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo -e "\nFailed to validate the following language file(s): ${failed[@]}"
            exit 1
          fi

  windows:
    name: Windows
    runs-on: windows-latest
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          Add-Content $env:GITHUB_OUTPUT "sha_short=$(git rev-parse --short HEAD)"

      - name: Append git revision to project version
        run: |
          (Get-Content version.py) `
          -Replace '^__version__\s*=\s*"[^"]+', "`$0.${{steps.vars.outputs.sha_short}}" |`
          Out-File version.py

      # Ensure Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      # TODO: Consider using https://github.com/crazy-max/ghaction-upx
      # or some other way of keeping the download link up to date in the future
      - name: Install UPX
        if: env.USE_UPX == 'true'
        run: |
          Invoke-WebRequest -Uri https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-win64.zip -OutFile (Join-Path $env:Temp upx.zip)
          Expand-Archive -LiteralPath (Join-Path $env:Temp upx.zip) -DestinationPath $env:Temp
          Move-Item -Path (Join-Path $env:Temp upx-*) -Destination (Join-Path $env:Temp upx)
          Add-Content $env:GITHUB_PATH (Join-Path $env:Temp upx)

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      - name: Create portable executable
        run: |
          pyinstaller build.spec

      - name: Create release folder
        run: |
          $FolderName = 'Twitch Drops Miner'
          New-Item $FolderName -ItemType Directory
          Copy-Item dist\*.exe $FolderName
          Copy-Item manual.txt $FolderName
          Compress-Archive -Path $FolderName -DestinationPath Twitch.Drops.Miner.Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Windows
          path: Twitch.Drops.Miner.Windows.zip

  macos:
    name: macOS
    runs-on: macos-latest
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Append git revision to project version
        run: |
          sed -i '' -E "s/^(__version__\s*=\s*\"[^\"]+)/\1.${{steps.vars.outputs.sha_short}}/" version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      - name: Create portable executable
        run: |
          pyinstaller build.spec --noconfirm

      - name: Create release folder and Zip
        run: |
          FOLDER="Twitch Drops Miner"
          mkdir -p "$FOLDER"
          cp -r dist/*.app "$FOLDER/"
          cp manual.txt "$FOLDER/"
          zip -r Twitch.Drops.Miner.MacOS.zip "$FOLDER"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.MacOS
          path: Twitch.Drops.Miner.MacOS.zip

  linux-pyinstaller:
    name: Linux (PyInstaller) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Append git revision to project version
        run: |
          sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.${{steps.vars.outputs.sha_short}}/" version.py

      # Ensure Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1 python3-tk

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      # NOTE: Remove this step if/once libxft gets updated to 2.3.5 or newer on Ubuntu 22.04, which currently has 2.3.4.
      - name: Build a recent version of libXft
        run: |
          mkdir -p /tmp/libXft
          cd /tmp/libXft
          curl -fL https://xorg.freedesktop.org/releases/individual/lib/libXft-2.3.9.tar.xz -o libXft.tar.xz
          sha256sum libXft.tar.xz
          tar xvf libXft.tar.xz
          cd libXft-*
          ./configure --prefix=/tmp/libXft --sysconfdir=/etc --disable-static
          make
          make install-strip

      - name: Create portable executable
        run: |
          LD_LIBRARY_PATH=/tmp/libXft/lib xvfb-run --auto-servernum pyinstaller build.spec

      - name: Show PyInstaller warnings
        run: |
          cat build/build/warn-build.txt || true

      - name: Create release folder
        run: |
          folder='Twitch Drops Miner'
          mkdir "${folder}"
          cp manual.txt dist/* "${folder}"
          7z a 'Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}.zip' "${folder}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}
          path: Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}.zip

  linux-appimage:
    name: Linux (AppImage) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          echo "app_version=$(python3 -c 'from version import __version__ as v; print(v)')" >> "${GITHUB_OUTPUT}"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Append git revision to project version
        run: |
          sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.${{steps.vars.outputs.sha_short}}/" version.py

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1

      - name: Install appimage-builder
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel
          python3 -m pip install setuptools setuptools_scm
          # TODO: Switch to a stable release if/when a version newer than 1.1.0 is released.
          python3 -m pip install git+https://github.com/AppImageCrafters/appimage-builder.git@1a8794d3c89f288fbd82b9accd7c0b74611147d5

      - name: Create AppImage
        env:
          ARCH: ${{matrix.arch}}
          ARCH_APT: ${{matrix.arch == 'x86_64' && 'amd64' || 'arm64'}}
          APP_VERSION: ${{steps.vars.outputs.app_version}}.${{steps.vars.outputs.sha_short}}
          PYTHON_VERSION: ${{env.PYTHON_VERSION}}
        run: |
          appimage-builder --recipe appimage/AppImageBuilder.yml

      - name: Create release folder
        run: |
          folder='Twitch Drops Miner'
          mkdir "${folder}"
          cp *.AppImage manual.txt "${folder}"
          7z a 'Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}.zip' "${folder}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}
          path: Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}.zip

  # Master pushes only build and keep the artifacts available on the run page; binaries are
  # published as a release when a version tag is pushed, so that the releases page carries
  # exactly one, complete, tested build per version.
  publish_release:
    name: Publish a tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux-pyinstaller
      - linux-appimage
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts from previous jobs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the checksums file
        run: |
          find artifacts -name '*.zip' -type f | sort | while read -r file; do
            echo "$(sha256sum "$file" | cut -d' ' -f1)  $(basename "$file")"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "artifacts/*/*,SHA256SUMS.txt"
          name: ${{github.ref_name}}
          prerelease: false
          tag: ${{github.ref_name}}
          body: |
            **Unofficial fix build** - a fork of
            [DevilXD/TwitchDropsMiner](https://github.com/DevilXD/TwitchDropsMiner), carrying the
            fixes needed after Twitch's 2026 API changes. All credit for the application itself goes
            to DevilXD and the upstream contributors.

            - Reference commit: `${{github.sha}}`

            **What is new in 16.2.4** - the list of games with drops is now published, and it
            updates by itself:

            - **The list of campaigns is no longer guessed - it is published and fetched.** Twitch
              stopped listing campaigns anywhere, so the list now comes from this repository's own
              `feeds` branch: `campaigns.json` there is rebuilt every hour from the public
              `twitchdrops.app` aggregator (which scrapes Twitch every ~13 minutes itself), and
              `games_seed.json` follows the maintainer's scan every six hours. The application reads
              the files at startup and re-checks them every hour while it runs, so a machine left
              open for days picks up new campaigns on its own. Only data lives on that branch, so a
              feed update can never ship half-finished code.
            - **The list decides what gets probed.** A campaign that is running, or starts within
              three days, puts its game into the deep probe of every scan without waiting for the
              catalogue rotation - even a game the catalogue has never heard of. New campaigns are
              found on the first scan after they appear.
            - **A button to refresh the list and to see how fresh it is.** Settings -> Drop scan now
              has "Update the drops list": it fetches the list immediately and re-runs the scan with
              it. Next to it the label reads "Drops list: 146 campaigns - 2026-10-23 09:07 UTC".
            - **The scan can be switched off.** The interval list reads Off / 5 / 10 / 30 / 60
              minutes. "Off" stops the schedule (the manual "Scan now" button still works) and keeps
              the chosen interval for when it is turned back on; the list keeps refreshing meanwhile.
            - **Both Advanced options are off out of the box.** The extra available-drops check used
              to be on by default, at the cost of an extra request per channel; every option in that
              section now starts disabled. A value already stored in `settings.json` is left alone.
            - What the published list cannot do: it cannot say whether *your* account has the game
              linked, and it carries no channel lists. Campaigns, channels and the account link still
              come from the miner's own scan - the list widens what is searched, it does not replace
              the check. A single third-party aggregator carries the fresh data, so a stale feed
              leaves the previous list in place rather than a broken one.

            Changed keys in `settings.json`: `seed_update_hours` now defaults to 1 (a stored 24 from
            an earlier build is migrated), `available_drops_check` now defaults to false.

            **Builds included:** Windows, macOS, Linux AppImage (x86_64, aarch64), Linux PyInstaller
            (x86_64, aarch64), with `SHA256SUMS.txt` covering all of them.

            The builds keep their original file names on purpose: unpack one over an existing
            installation to update it while keeping `settings.json`, the login and the scan cache.
            Close the running application first - the executable is locked while it runs, and only a
            single instance can run at a time.

            Not tested on hardware: the macOS build (and it is unsigned, so Gatekeeper will
            complain) and both aarch64 builds - those come straight off the CI runners.

            ---

            **Неофициальная fix-сборка** [DevilXD/TwitchDropsMiner](https://github.com/DevilXD/TwitchDropsMiner)
            с исправлениями под изменения API Twitch 2026 года. Все права на само приложение
            принадлежат DevilXD и контрибьюторам апстрима.

            - Коммит-основа: `${{github.sha}}`

            **Что нового в 16.2.4** — список игр с дропами теперь публикуется и обновляется сам:

            - **Список кампаний больше не угадывается — он публикуется и загружается.** Twitch
              перестал показывать кампании где-либо, поэтому список теперь берётся из ветки `feeds`
              этого же репозитория: `campaigns.json` там пересобирается раз в час из публичного
              агрегатора `twitchdrops.app` (он сам опрашивает Twitch примерно раз в 13 минут), а
              `games_seed.json` раз в шесть часов обновляет скан мейнтейнера. Приложение читает файлы
              при запуске и перепроверяет их раз в час, пока работает, так что машина, оставленная
              включённой на сутки, новые кампании видит сама. В ветке только данные — обновление фида
              не может притащить в релиз недоделанный код.
            - **Список решает, что опрашивать.** Кампания, идущая сейчас или начинающаяся в ближайшие
              три дня, отправляет свою игру в глубокий опрос на каждом скане, не дожидаясь ротации
              каталога — даже если каталог про такую игру не знает. Новые кампании ловятся на первом
              же скане после появления в списке.
            - **Кнопка обновления списка и подпись о его свежести.** В настройках, в секции «Скан
              дропов», появилась кнопка «Обновить список дропов»: она тянет список немедленно и сразу
              перезапускает скан. Рядом подпись «Список дропов: 146 кампаний · 2026-10-23 09:07 UTC».
            - **Скан можно выключить.** Список интервалов теперь читается как Выкл / 5 / 10 / 30 / 60
              минут. «Выкл» останавливает расписание (ручная кнопка «Сканировать сейчас» работает) и
              запоминает выбранный интервал — при включении он вернётся; обновление списка при этом
              продолжается.
            - **Обе опции «Расширенных» выключены по умолчанию.** Дополнительная проверка доступных
              дропов была включена по умолчанию ценой лишнего запроса на канал; теперь все опции этой
              секции стартуют выключенными. Уже сохранённое в `settings.json` значение не трогается.
            - Чего опубликованный список не умеет: он ничего не знает про привязку *вашего* аккаунта и
              не содержит списков каналов. Кампании, каналы и привязку по-прежнему определяет
              собственный скан — список расширяет то, что ищется, но не заменяет проверку. Свежие
              данные несёт один сторонний агрегатор, поэтому устаревший фид оставляет прежний список,
              а не битый.

            Изменённые ключи в `settings.json`: `seed_update_hours` теперь по умолчанию 1 (сохранённое
            в прошлых сборках значение 24 мигрируется), `available_drops_check` — по умолчанию false.

            **В релизе:** Windows, macOS, Linux AppImage (x86_64, aarch64), Linux PyInstaller
            (x86_64, aarch64) и `SHA256SUMS.txt` с хэшами всех сборок.

            Имена файлов специально такие же, как у апстрима: сборку можно распаковать поверх уже
            установленной, сохранив `settings.json`, логин и кэш скана. Перед заменой закройте
            приложение — запущенный исполняемый файл заблокирован, и одновременно может работать
            только один экземпляр.

            На железе не проверялись: сборка для macOS (и она без подписи, так что Gatekeeper будет
            ругаться) и обе aarch64-сборки — они взяты прямо с раннеров CI.
