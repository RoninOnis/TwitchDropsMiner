name: Build

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  USE_UPX: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Validate language files
        run: |
          failed=()
          for file in "lang/"*.json; do
            if err="$(python -m json.tool "${file}" 2>&1 >/dev/null)"; then
              echo "[OK] ${file}"
            else
              echo "[ERROR] ${file} ${err}"
              failed+=("${file}")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo -e "\nFailed to validate the following language file(s): ${failed[@]}"
            exit 1
          fi

  windows:
    name: Windows
    runs-on: windows-latest
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          Add-Content $env:GITHUB_OUTPUT "sha_short=$(git rev-parse --short HEAD)"

      - name: Append git revision to project version
        run: |
          (Get-Content version.py) `
          -Replace '^__version__\s*=\s*"[^"]+', "`$0.${{steps.vars.outputs.sha_short}}" |`
          Out-File version.py

      # Ensure Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      # TODO: Consider using https://github.com/crazy-max/ghaction-upx
      # or some other way of keeping the download link up to date in the future
      - name: Install UPX
        if: env.USE_UPX == 'true'
        run: |
          Invoke-WebRequest -Uri https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-win64.zip -OutFile (Join-Path $env:Temp upx.zip)
          Expand-Archive -LiteralPath (Join-Path $env:Temp upx.zip) -DestinationPath $env:Temp
          Move-Item -Path (Join-Path $env:Temp upx-*) -Destination (Join-Path $env:Temp upx)
          Add-Content $env:GITHUB_PATH (Join-Path $env:Temp upx)

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      - name: Create portable executable
        run: |
          pyinstaller build.spec

      - name: Create release folder
        run: |
          $FolderName = 'Twitch Drops Miner'
          New-Item $FolderName -ItemType Directory
          Copy-Item dist\*.exe $FolderName
          Copy-Item manual.txt $FolderName
          Compress-Archive -Path $FolderName -DestinationPath Twitch.Drops.Miner.Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Windows
          path: Twitch.Drops.Miner.Windows.zip

  macos:
    name: macOS
    runs-on: macos-latest
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Append git revision to project version
        run: |
          sed -i '' -E "s/^(__version__\s*=\s*\"[^\"]+)/\1.${{steps.vars.outputs.sha_short}}/" version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      - name: Create portable executable
        run: |
          pyinstaller build.spec --noconfirm

      - name: Create release folder and Zip
        run: |
          FOLDER="Twitch Drops Miner"
          mkdir -p "$FOLDER"
          cp -r dist/*.app "$FOLDER/"
          cp manual.txt "$FOLDER/"
          zip -r Twitch.Drops.Miner.MacOS.zip "$FOLDER"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.MacOS
          path: Twitch.Drops.Miner.MacOS.zip

  linux-pyinstaller:
    name: Linux (PyInstaller) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Append git revision to project version
        run: |
          sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.${{steps.vars.outputs.sha_short}}/" version.py

      # Ensure Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1 python3-tk

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      # NOTE: Remove this step if/once libxft gets updated to 2.3.5 or newer on Ubuntu 22.04, which currently has 2.3.4.
      - name: Build a recent version of libXft
        run: |
          mkdir -p /tmp/libXft
          cd /tmp/libXft
          curl -fL https://xorg.freedesktop.org/releases/individual/lib/libXft-2.3.9.tar.xz -o libXft.tar.xz
          sha256sum libXft.tar.xz
          tar xvf libXft.tar.xz
          cd libXft-*
          ./configure --prefix=/tmp/libXft --sysconfdir=/etc --disable-static
          make
          make install-strip

      - name: Create portable executable
        run: |
          LD_LIBRARY_PATH=/tmp/libXft/lib xvfb-run --auto-servernum pyinstaller build.spec

      - name: Show PyInstaller warnings
        run: |
          cat build/build/warn-build.txt || true

      - name: Create release folder
        run: |
          folder='Twitch Drops Miner'
          mkdir "${folder}"
          cp manual.txt dist/* "${folder}"
          7z a 'Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}.zip' "${folder}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}
          path: Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}.zip

  linux-appimage:
    name: Linux (AppImage) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          echo "app_version=$(python3 -c 'from version import __version__ as v; print(v)')" >> "${GITHUB_OUTPUT}"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Append git revision to project version
        run: |
          sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.${{steps.vars.outputs.sha_short}}/" version.py

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1

      - name: Install appimage-builder
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel
          python3 -m pip install setuptools setuptools_scm
          # TODO: Switch to a stable release if/when a version newer than 1.1.0 is released.
          python3 -m pip install git+https://github.com/AppImageCrafters/appimage-builder.git@1a8794d3c89f288fbd82b9accd7c0b74611147d5

      - name: Create AppImage
        env:
          ARCH: ${{matrix.arch}}
          ARCH_APT: ${{matrix.arch == 'x86_64' && 'amd64' || 'arm64'}}
          APP_VERSION: ${{steps.vars.outputs.app_version}}.${{steps.vars.outputs.sha_short}}
          PYTHON_VERSION: ${{env.PYTHON_VERSION}}
        run: |
          appimage-builder --recipe appimage/AppImageBuilder.yml

      - name: Create release folder
        run: |
          folder='Twitch Drops Miner'
          mkdir "${folder}"
          cp *.AppImage manual.txt "${folder}"
          7z a 'Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}.zip' "${folder}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}
          path: Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}.zip

  # Master pushes only build and keep the artifacts available on the run page; binaries are
  # published as a release when a version tag is pushed, so that the releases page carries
  # exactly one, complete, tested build per version.
  publish_release:
    name: Publish a tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux-pyinstaller
      - linux-appimage
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts from previous jobs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the checksums file
        run: |
          find artifacts -name '*.zip' -type f | sort | while read -r file; do
            echo "$(sha256sum "$file" | cut -d' ' -f1)  $(basename "$file")"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "artifacts/*/*,SHA256SUMS.txt"
          name: ${{github.ref_name}}
          prerelease: false
          tag: ${{github.ref_name}}
          body: |
            **Unofficial fix build** - a fork of
            [DevilXD/TwitchDropsMiner](https://github.com/DevilXD/TwitchDropsMiner), carrying the
            fixes needed after Twitch's 2026 API changes. All credit for the application itself goes
            to DevilXD and the upstream contributors.

            - Reference commit: `${{github.sha}}`

            **What is new in 16.2.3** - discovery runs on a published list, not on guesswork:

            - **Two feeds are refreshed from this repository.** `games_seed.json` (the games that
              carry drops) and `campaigns.json` (the campaigns themselves, with their dates) are
              fetched on startup, at most once per `seed_update_hours` (24 by default). Without
              network, or if the file has not changed, the bundled copy stays in use - silently.
            - **A game with a running campaign is probed deep on every scan.** If the feed says a
              campaign runs now or starts within three days, that game goes straight into the deep
              probe set instead of waiting for the catalogue rotation - including a game the
              catalogue has never heard of. A new campaign shows up on the first scan after it
              appears, not after a full pass over thousands of games.
            - **The feeds are published by the maintainer** every six hours: one scan, then
              `tools/publish_feeds.py`, then a commit. `tools/scan_once.py` is that single scan,
              for a headless machine under `xvfb-run`.
            - **The coverage is visible.** Settings -> Drop scan shows a bar and a line such as
              "Checked 920 of 5121 games (18%) - from the published list: 5068 - campaigns: 28".
            - **The progress numbers now say what they mean.** The campaign line used to read
              "93.0% (4/5)" - the average progress of every drop in the campaign next to the count
              of collected drops, two different things. It reads "4/5 - average 93.0%" now, the
              inventory cell shows minutes watched ("3.3%, 1/30 min"), and the tray title shows the
              drop's own minutes instead of mixing them with the campaign's drop count.
            - **A "Linked" filter in the inventory**, next to "Not linked": only campaigns whose
              game account is connected.
            - **The scan no longer edits your priority list.** It used to be able to append every
              game it found to it; that option and the setting behind it are gone.
            - **Five looks to pick from** in Settings: classic light, classic dark, graphite, light
              with accents, and a compact contrast one. Every palette keeps its text at a contrast
              ratio of at least 4.5:1.

            New keys in `settings.json`: `seed_auto_update` (true), `seed_update_hours` (24),
            `theme` (empty follows the dark mode checkbox).

            **Builds included:** Windows, macOS, Linux AppImage (x86_64, aarch64), Linux PyInstaller
            (x86_64, aarch64), with `SHA256SUMS.txt` covering all of them.

            The builds keep their original file names on purpose: unpack one over an existing
            installation to update it while keeping `settings.json`, the login and the scan cache.
            Close the running application first - the executable is locked while it runs, and only a
            single instance can run at a time.

            Not tested on hardware: the macOS build (and it is unsigned, so Gatekeeper will
            complain) and both aarch64 builds - those come straight off the CI runners.

            ---

            **Неофициальная fix-сборка** [DevilXD/TwitchDropsMiner](https://github.com/DevilXD/TwitchDropsMiner)
            с исправлениями под изменения API Twitch 2026 года. Все права на само приложение
            принадлежат DevilXD и контрибьюторам апстрима.

            - Коммит-основа: `${{github.sha}}`

            **Что нового в 16.2.3** — поиск идёт по опубликованному списку, а не наугад:

            - **Два файла обновляются из этого репозитория.** `games_seed.json` (игры, у которых
              бывают дропы) и `campaigns.json` (сами кампании с датами) загружаются при старте, не
              чаще раза в `seed_update_hours` (по умолчанию 24 часа). Без сети или если файл не
              изменился, остаётся зашитая копия — молча, без ошибок в интерфейсе.
            - **Игра с идущей кампанией опрашивается глубоко на каждом скане.** Если по фиду
              кампания идёт сейчас или начнётся в ближайшие три дня, игра попадает в глубокий опрос
              сразу, не дожидаясь очереди ротации каталога — даже если каталог про такую игру ничего
              не знает. Новая кампания находится на первом же скане после появления, а не после
              полного прохода по тысячам игр.
            - **Фиды публикует сопровождающий** каждые шесть часов: один скан, затем
              `tools/publish_feeds.py`, затем коммит. `tools/scan_once.py` — это тот самый одиночный
              скан, для машины без экрана запускается под `xvfb-run`.
            - **Покрытие видно.** В настройках, в секции «Скан дропов», есть полоса и строка вида
              «Проверено 920 из 5121 игр (18%) · из списка: 5068 · кампаний: 28».
            - **Числа прогресса теперь означают то, что написано.** Строка кампании раньше читалась
              как «93.0% (4/5)» — средний прогресс по всем дропам рядом с числом собранных дропов, две
              разные величины. Теперь там «4/5 · средний 93.0%», в таблице инвентаря минуты
              «3.3%, 1/30 мин», а в заголовке трея минуты самого дропа, а не число дропов кампании.
            - **Фильтр «Связанные» в инвентаре**, рядом с «Не связано»: только кампании с
              привязанным игровым аккаунтом.
            - **Скан больше не правит ваш список приоритетов.** Раньше он мог дописывать в него
              каждую найденную игру; эта галочка и настройка под ней убраны.
            - **Пять вариантов оформления** в настройках: классическая светлая, классическая тёмная,
              графит, светлая с акцентами и компактная контрастная. У каждой палитры контраст текста
              не ниже 4.5:1.

            Новые ключи в `settings.json`: `seed_auto_update` (true), `seed_update_hours` (24),
            `theme` (пусто — следовать галочке тёмной темы).

            **В релизе:** Windows, macOS, Linux AppImage (x86_64, aarch64), Linux PyInstaller
            (x86_64, aarch64) и `SHA256SUMS.txt` с хэшами всех сборок.

            Имена файлов специально такие же, как у апстрима: сборку можно распаковать поверх уже
            установленной, сохранив `settings.json`, логин и кэш скана. Перед заменой закройте
            приложение — запущенный исполняемый файл заблокирован, и одновременно может работать
            только один экземпляр.

            На железе не проверялись: сборка для macOS (и она без подписи, так что Gatekeeper будет
            ругаться) и обе aarch64-сборки — они взяты прямо с раннеров CI.
